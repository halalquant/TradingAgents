name: Trading Bot CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy

env:
  IMAGE_NAME: jafarmuhammad/cryptoquant
  KUBE_NAMESPACE: trading-bot

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    if: >
      github.ref == 'refs/heads/main' &&
      github.event.inputs.action == 'deploy'
    outputs:
      image_tag: ${{ steps.vars.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: vars
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          platforms: linux/amd64

  deploy-bot:
    name: Deploy Telegram Bot
    runs-on: ubuntu-22.04
    needs: build
    if: github.event.inputs.action == 'deploy'

    steps:
      - name: Deploy bot
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          KUBE_NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        with:
          host: ${{ secrets.KUBE_HOST }}
          username: ${{ secrets.KUBE_USER }}
          key: ${{ secrets.KUBE_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAME,KUBE_NAMESPACE
          script: |
            set -e
            IMAGE_FULL="${IMAGE_NAME}:${IMAGE_TAG}"
            kubectl set image deployment/telegram-bot \
              bot=${IMAGE_FULL} \
              -n ${KUBE_NAMESPACE}
            kubectl rollout status deployment/telegram-bot -n ${KUBE_NAMESPACE}

  deploy-worker:
    name: Deploy RQ Worker
    runs-on: ubuntu-22.04
    needs: build
    if: github.event.inputs.action == 'deploy'

    steps:
      - name: Deploy worker
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          KUBE_NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        with:
          host: ${{ secrets.KUBE_HOST }}
          username: ${{ secrets.KUBE_USER }}
          key: ${{ secrets.KUBE_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAME,KUBE_NAMESPACE
          script: |
            set -e
            IMAGE_FULL="${IMAGE_NAME}:${IMAGE_TAG}"
            kubectl set image deployment/rq-worker \
              worker=${IMAGE_FULL} \
              -n ${KUBE_NAMESPACE}
            kubectl rollout status deployment/rq-worker -n ${KUBE_NAMESPACE}

  rollback-bot:
    name: Rollback Telegram Bot
    runs-on: ubuntu-22.04
    if: github.event.inputs.action == 'deploy'

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          KUBE_NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        with:
          host: ${{ secrets.KUBE_HOST }}
          username: ${{ secrets.KUBE_USER }}
          key: ${{ secrets.KUBE_SSH_KEY }}
          envs: KUBE_NAMESPACE
          script: |
            kubectl rollout undo deployment/telegram-bot -n ${KUBE_NAMESPACE}
            kubectl rollout status deployment/telegram-bot -n ${KUBE_NAMESPACE}

  rollback-worker:
    name: Rollback RQ Worker
    runs-on: ubuntu-22.04
    if: github.event.inputs.action == 'deploy'

    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          KUBE_NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        with:
          host: ${{ secrets.KUBE_HOST }}
          username: ${{ secrets.KUBE_USER }}
          key: ${{ secrets.KUBE_SSH_KEY }}
          envs: KUBE_NAMESPACE
          script: |
            kubectl rollout undo deployment/rq-worker -n ${KUBE_NAMESPACE}
            kubectl rollout status deployment/rq-worker -n ${KUBE_NAMESPACE}
